name: Bug report
description: A component, token, or recipe is doing the wrong thing.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. Please fill in every field — vague reports get auto-closed.
        For security vulnerabilities, **do not file here** — see [SECURITY.md](../../SECURITY.md).

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Output of `pnpm view @devalok/shilp-sutra version` OR the version pinned in your lockfile.
      placeholder: "0.52.0"
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - "Next.js (App Router)"
        - "Next.js (Pages Router)"
        - "Vite + React"
        - "Astro"
        - "Remix"
        - "TanStack Start"
        - "Other (specify in description)"
    validations:
      required: true

  - type: input
    id: framework-version
    attributes:
      label: Framework version
      placeholder: "Next 15.x / Vite 8.x / Astro 5.x"
    validations:
      required: true

  - type: input
    id: package-manager
    attributes:
      label: Package manager
      placeholder: "pnpm 10.0.0 / npm 11.5.1 / yarn 4 / bun 1.x"
    validations:
      required: true

  - type: textarea
    id: peer-deps
    attributes:
      label: Relevant peer dep versions
      description: framer-motion, sonner, tailwindcss, react. Run `pnpm why <name>` if you suspect duplicates.
      placeholder: |
        framer-motion: ^12.10.0
        tailwindcss: ^4.0.5
        react: ^19.0.0
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Either a Stackblitz/CodeSandbox link OR a self-contained code snippet that reproduces the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Paste exact error messages, stack traces, console warnings, or a screenshot.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you've already tried
      description: Recipes followed, troubleshoot.md steps attempted, workarounds.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I read the [troubleshoot guide](../../packages/core/docs/recipes/troubleshoot.md) before filing.
          required: true
        - label: I checked existing open issues for duplicates.
          required: true
