name: CI

on:
  pull_request:
    branches: [main]

# Two pushes to a PR in quick succession ran the whole suite twice and kept both results.
# GitHub bills every JOB rounded up to a whole minute, so a superseded run is not free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Turborepo remote cache (self-hosted on Railway). PR CI reads+writes the
    # shared cache so unchanged packages restore instead of rebuild. Degrades
    # gracefully to no-cache if TURBO_TOKEN is unset. The RELEASE workflow does
    # NOT set these + forces fresh builds, so a published artifact is never
    # served from cache.
    env:
      TURBO_API: https://turbo-ss.devalok.dev
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: team_devalok

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PRs touching ONLY packages/mcp-server/** skip the heavy DS pipeline
      # (build/typecheck/test/storybook ≈ 10+ min) and run the MCP smoke suite
      # instead (≈ 30s). The job still succeeds, so the required "ci" check
      # stays satisfied — do NOT convert this to paths-ignore on the trigger,
      # which would leave the required check pending and block merges.
      - name: Detect change scope
        id: scope
        run: |
          # Fetch the base ref WITH ancestry (no --depth=1). The three-dot diff
          # below needs a merge-base; a shallow depth-1 fetch only has the base
          # tip, so when a branch's fork-point is not the current base tip (base
          # advanced after branching), merge-base fails: "no merge base", exit
          # 128. Checkout already uses fetch-depth: 0, so full history is cheap.
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "$CHANGED"
          # mcp_only: EVERY changed file is under packages/mcp-server/ → skip the
          # heavy DS pipeline, run only the fast MCP smoke.
          if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qv '^packages/mcp-server/'; then
            echo "mcp_only=true" >> "$GITHUB_OUTPUT"
            echo "MCP-server-only change — running MCP smoke suite, skipping DS pipeline."
          else
            echo "mcp_only=false" >> "$GITHUB_OUTPUT"
          fi
          # mcp_changed: ANY change that can affect the core↔MCP contract — the
          # server itself, the manifest generator, or the manifest schema. Runs
          # the smoke even on MIXED PRs (previously the smoke only ran on
          # mcp-only PRs, so a core+mcp PR validated the MCP server not at all).
          if echo "$CHANGED" | grep -qE '^packages/mcp-server/|packages/core/scripts/build-mcp-manifest|packages/core/mcp-manifest\.schema\.json'; then
            echo "mcp_changed=true" >> "$GITHUB_OUTPUT"
            echo "MCP-relevant change — MCP smoke will run."
          else
            echo "mcp_changed=false" >> "$GITHUB_OUTPUT"
          fi
          # site_changed: gates the Lighthouse budget check (≈3 min: 3 runs over a
          # local production server). The site consumes packages/core, so a core
          # change can regress it too — but core PRs are the common case and
          # paying 3 min on every one of them is how a gate becomes something
          # people route around. Scoped to apps/site/** plus the gate's own
          # config; integration.yml is NOT in play here (see workflow comment).
          if echo "$CHANGED" | grep -qE '^apps/site/'; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
            echo "apps/site change — Lighthouse budget gate will run."
          else
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs on any MCP-relevant change (mcp-only OR mixed). Regenerates the
      # manifest first because it is a build artifact (gitignored, not committed);
      # the smoke serves the local core tree and reads packages/core/mcp-manifest.json.
      # Regen is fast (reads src/tokens + docs/components, no dist build needed).
      - name: MCP server smoke test
        if: steps.scope.outputs.mcp_changed == 'true'
        run: |
          (cd packages/core && node scripts/build-mcp-manifest.mjs)
          node packages/mcp-server/scripts/smoke.mjs

      # Build the library FIRST so workspace consumers (apps/site) can resolve
      # @devalok/shilp-sutra/ui/* subpath imports during typecheck. The site
      # showcase pages import per-component subpaths from the package's `dist/`,
      # so typechecking before build produces TS2307 cascades.
      - name: Build library
        if: steps.scope.outputs.mcp_only != 'true'
        run: pnpm build

      - name: Typecheck
        if: steps.scope.outputs.mcp_only != 'true'
        run: pnpm typecheck

      - name: Lint
        if: steps.scope.outputs.mcp_only != 'true'
        run: pnpm lint

      - name: Check Props exports
        if: steps.scope.outputs.mcp_only != 'true'
        run: pnpm lint:props

      # Recipe/make-kit snippets must compile against the shipped .d.ts. Needs
      # the build above, since it resolves against dist rather than src — a
      # snippet is only correct if it is correct against what consumers get.
      - name: Typecheck doc snippets
        if: steps.scope.outputs.mcp_only != 'true'
        run: pnpm --filter @devalok/shilp-sutra typecheck:docs

      - name: Test
        if: steps.scope.outputs.mcp_only != 'true'
        run: pnpm test

      - name: SSR smoke test
        if: steps.scope.outputs.mcp_only != 'true'
        run: node packages/core/scripts/ssr-smoke-test.mjs

      - name: Check bundle size
        if: steps.scope.outputs.mcp_only != 'true'
        run: |
          # Measure the runtime JS + CSS + .d.ts (what consumers actually pull in).
          # Exclude .map files — sourcemaps are dev-debug aids shipped alongside
          # npm artifacts but never counted against a runtime budget.
          TOTAL=$(find packages/core/dist -type f ! -name '*.map' -printf '%s\n' | awk '{s+=$1} END{print s}')
          MAP_TOTAL=$(find packages/core/dist -type f -name '*.map' -printf '%s\n' | awk '{s+=$1} END{print s+0}')
          MAX=5242880  # 5MB runtime budget
          echo "Core runtime bundle:  $((TOTAL / 1024))KB / $((MAX / 1024))KB"
          echo "Core sourcemaps:      $((MAP_TOTAL / 1024))KB (excluded from budget)"
          if [ "$TOTAL" -gt "$MAX" ]; then
            echo "::error::Runtime bundle size $((TOTAL / 1024))KB exceeds budget of $((MAX / 1024))KB"
            exit 1
          fi

      # Blocking perf/a11y/SEO budget gate for the marketing site. Nothing was
      # watching apps/site, which is why four Lighthouse regressions (23MB audio
      # preload, aria-hidden over focusable Switches, 29 non-composited stroke
      # animations, non-descriptive link text — issue #255) all landed unnoticed.
      #
      # Runs against a LOCAL production build, not shilp-sutra.devalok.in: CI must
      # not depend on Railway being up, and must grade this PR's code rather than
      # whatever is deployed. `pnpm build` above already produced apps/site/.next
      # (turbo builds the whole workspace), so lhci only needs to boot the server,
      # which its own startServerCommand handles.
      #
      # Thresholds, aggregation (median of 3) and the reasoning behind every
      # assertion live in apps/site/lighthouserc.json — read that before touching
      # a number here.
      - name: Lighthouse budget gate (apps/site)
        if: steps.scope.outputs.mcp_only != 'true' && steps.scope.outputs.site_changed == 'true'
        working-directory: apps/site
        run: pnpm lighthouse

      # Reports for the run above, so a failure is diagnosable without a local
      # repro. `always()` because the interesting case is the failing one.
      - name: Upload Lighthouse reports
        if: always() && steps.scope.outputs.mcp_only != 'true' && steps.scope.outputs.site_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/site/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Playwright
        if: steps.scope.outputs.mcp_only != 'true'
        run: npx playwright install chromium

      - name: Test Stories (browser)
        if: steps.scope.outputs.mcp_only != 'true'
        run: pnpm test:storybook:ci
