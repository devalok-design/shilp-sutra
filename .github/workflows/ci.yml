name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check Props exports
        run: pnpm lint:props

      - name: Test
        run: pnpm test

      - name: Build library
        run: pnpm build

      - name: Check bundle size
        run: |
          TOTAL=$(du -sb packages/core/dist | cut -f1)
          MAX=5242880  # 5MB budget
          echo "Core bundle size: $((TOTAL / 1024))KB / $((MAX / 1024))KB"
          if [ "$TOTAL" -gt "$MAX" ]; then
            echo "::error::Bundle size $((TOTAL / 1024))KB exceeds budget of $((MAX / 1024))KB"
            exit 1
          fi

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Test Stories (browser)
        run: pnpm test:storybook:ci
