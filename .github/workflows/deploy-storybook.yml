name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
    # Storybook documents the component library, not the marketing site.
    # Site-only changes (apps/site/**) don't change any story — skip the redeploy.
    paths-ignore:
      - 'apps/site/**'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time, cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the library FIRST: apps/site imports @devalok/shilp-sutra via
      # per-component subpaths, whose .d.ts only exist after the build. Running
      # typecheck before the build fails with TS2307 (module not found) +
      # cascading TS7006 implicit-any on callback params whose types come from
      # those unresolved modules. ci.yml fixed this in f559bd40; mirror it here.
      - name: Build library
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check Props exports
        run: pnpm lint:props

      - name: Test
        run: pnpm test

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Build Playground
        run: pnpm build:playground

      - name: Merge Playground into Storybook output
        run: |
          mkdir -p storybook-static/playground
          cp -r apps/playground/dist/* storybook-static/playground/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
