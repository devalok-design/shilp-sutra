name: Integration

# Post-merge integration gates. Runs the RELEASE-UNIQUE gauntlet — the checks
# that PR CI (ci.yml) does NOT run — on every main push, so a break is caught at
# merge time (while the author is still around), NOT weeks later when someone
# presses the publish button.
#
# This workflow NEVER publishes. It has no id-token permission and no publish
# step. Publishing lives in release.yml (workflow_dispatch only).
#
# Division of labor:
#   ci.yml (PRs)       → build, typecheck, lint, lint:props, test, ssr-smoke,
#                        bundle-size, storybook browser tests (turbo remote cache)
#   integration.yml    → the gates PR CI can't/doesn't run: pre-publish-audit,
#     (this, on main)    consumer-smoke (Next+TW4), compiled-CSS coverage,
#                        skill-ref drift. These caught the 0.49.0 breaks PR CI
#                        missed (4 hotfix PRs). Do not delete them. (Chromatic is
#                        NOT here — visual-review.yml owns main-push snapshots.)
#   release.yml        → the FULL gauntlet + publish, dispatch-only, self-verifying.
#
# NOTE: the gate steps below are a subset of release.yml's. When you add or
# change a release gate, keep this file in sync (or the net has a hole).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/site/**'
      - 'packages/mcp-server/**'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Never serve release-integration builds from the remote cache — build fresh.
      TURBO_FORCE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `Detect affected packages` diffs against `github.event.before`.
          # The default `fetch-depth: 1` does not fetch that commit, so the
          # diff died with `fatal: bad object` and every core gate below was
          # skipped. fetch-depth: 0 guarantees the base commit is present.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Core-only gates (consumer-smoke, css-coverage) don't apply to a
      # brand/eslint-only push. Skip them there. Fail safe: anything ambiguous
      # -> run full gates.
      # FAIL CLOSED. This gate decides whether the core-only gates below run at
      # all, so anything that is not a confident "core is untouched" must run
      # them. The previous version failed OPEN: a shallow checkout meant
      # `github.event.before` was not in the clone, `git diff` exited with
      # `fatal: bad object`, the `elif` was therefore false, and control fell
      # through to `else` -> core=false. Every consumer gate (smoke, strict
      # install, compiled-CSS coverage) silently skipped on every push while
      # the workflow reported success — a safety net that quietly unhooked
      # itself. Verifying the base commit exists BEFORE diffing keeps a git
      # failure from ever reading as "nothing changed".
      - name: Detect affected packages
        id: affected
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "Affected: non-push or no base ref -> full gates."
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "Affected: base commit $BEFORE not in this clone -> cannot diff, running full gates."
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^packages/core/'; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "Affected: packages/core changed -> full gates."
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
            echo "Affected: packages/core untouched -> skipping core-only integration gates."
          fi

      # Build is required for the dist-reading gates below (audit, consumer-smoke,
      # css-coverage).
      - name: Build
        run: pnpm build

      # Regenerate skill references before the audit's drift gate (build-skill.mjs
      # copies from llms.txt / docs/recipes). Without this the audit fails on any
      # push that edited a source but didn't commit the regenerated ref.
      - name: Regenerate Agent Skill references
        run: node scripts/build-skill.mjs

      # Full HARD-gate audit. SS_AUDIT_SKIP_REDUNDANT=1 skips build/typecheck/
      # test/ssr — those already ran in ci.yml on the PR; here we want the
      # audit-UNIQUE gates (docs coverage, token hygiene, manifest, skill,
      # breaking, bundle, exports order). Downstream dist-reading gates use the
      # Build step above.
      - name: Pre-publish audit
        run: node scripts/pre-publish-audit.mjs
        env:
          SS_AUDIT_SKIP_REDUNDANT: '1'

      # Dist-side net: packs the tarball into a throwaway Next 16 + TW4 +
      # Turbopack app and runs `next build`. Catches RSC/CSS regressions no
      # other gate exercises. THE gate that would have caught Karm's 0.34/0.36
      # blockers.
      - name: Consumer smoke (Next 16 + Turbopack + TW4)
        if: steps.affected.outputs.core == 'true'
        run: node scripts/consumer-smoke-test.mjs

      # pnpm isolated layout + every subpath. The smoke consumer above
      # installs npm-style (hoisted, peers auto-installed), which hides
      # undeclared deps and forgotten peers. This one cannot.
      - name: Consumer strict install (pnpm isolated, all subpaths)
        if: steps.affected.outputs.core == 'true'
        run: node scripts/consumer-strict-install.mjs --no-build

      - name: Compiled-CSS coverage (Turbopack)
        if: steps.affected.outputs.core == 'true'
        run: node scripts/audit-compiled-css.mjs

      - name: Consumer smoke (Next 15 + Webpack)
        if: ${{ steps.affected.outputs.core == 'true' && hashFiles('tests/smoke-consumer-next15/package.json') != '' }}
        run: node scripts/consumer-smoke-test.mjs --variant next15-webpack

      - name: Compiled-CSS coverage (Webpack)
        if: ${{ steps.affected.outputs.core == 'true' && hashFiles('tests/smoke-consumer-next15/package.json') != '' }}
        run: node scripts/audit-compiled-css.mjs --variant next15-webpack

      # NOTE: Chromatic is intentionally NOT run here. visual-review.yml already
      # snapshots every main push (non-blocking, per-commit baselines). A second,
      # blocking Chromatic run post-merge would double snapshot quota AND could
      # only paint a red X on an already-merged commit (gating nothing). The
      # BLOCKING visual gate lives on the publish path (release.yml), where it
      # can actually stop a bad baseline from shipping.
