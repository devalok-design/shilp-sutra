name: Regenerate lockfile (Linux)

# ONE-SHOT UTILITY — delete this file once the lockfile is committed.
#
# pnpm-lock.yaml must be generated on Linux. A Windows-generated lockfile omits
# Linux-only optional dependencies, which installs fine locally and then dies at
# `pnpm install --frozen-lockfile` on a Linux runner or in Docker. This repo
# already carries `chore: regenerate lockfile on ubuntu-latest` for that reason.
#
# Triggered by pushes to this ONE branch, not workflow_dispatch: GitHub only
# offers workflow_dispatch for workflows that already exist on the DEFAULT
# branch, and this one does not (that is the whole chicken-and-egg it solves).
# It cannot loop — a push made with GITHUB_TOKEN does not trigger workflows.
#
# It regenerates the lockfile only (no node_modules install) and commits it back
# to the same branch.

on:
  push:
    branches:
      - feat/cloudflare-workers-deploy

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout the dispatched branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --lockfile-only: resolve and write pnpm-lock.yaml without installing
      # node_modules. Deliberately NOT --frozen-lockfile, which is the whole point.
      - name: Regenerate pnpm-lock.yaml
        run: pnpm install --lockfile-only

      - name: Commit if it changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "lockfile unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate lockfile on ubuntu-latest

          Generated by .github/workflows/regen-lockfile.yml. A Windows-generated
          lockfile omits Linux-only optional dependencies and breaks
          \`pnpm install --frozen-lockfile\` on a Linux runner."
          git push origin HEAD:${{ github.ref_name }}
          echo "lockfile regenerated and pushed to ${{ github.ref_name }}"
