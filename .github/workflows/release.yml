name: Release

on:
  push:
    branches: [main]
  # Allow manual re-runs from the Actions UI / gh CLI without needing a new commit.
  # Useful when a prior publish failed on a transient issue (auth, registry outage,
  # token expiry) and we want to retry with the fix in place — as happened after
  # 0.36.0's initial NPM_TOKEN setup. See 2026-04-19 retro.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # ── Release-mode guard ─────────────────────────────────────────────────────
  # Ensures `.changeset/pre.json` state matches the intent of the run:
  #   - on branches other than `main` we don't publish at all
  #   - on `main` with `pre.json` present → we're in prerelease mode, publishing to `@next`
  #   - on `main` without `pre.json` → stable publish to `@latest`
  # If prerelease mode leaked onto a stable release (forgot `pnpm changeset pre exit`)
  # we fail the run BEFORE publishing.
  guard:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect prerelease state
        id: check
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "Release guard: .changeset/pre.json present → prerelease mode (@next)"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "Release guard: no pre.json → stable release (@latest)"
          fi

  # ── Release job — gated on guard ───────────────────────────────────────────
  release:
    needs: guard
    runs-on: ubuntu-latest
    # OIDC trusted publishing: `id-token: write` lets npm verify the publish
    # came from this workflow without a long-lived NPM_TOKEN. `contents: write`
    # lets changesets/action open the Version Packages PR and push tags.
    # `pull-requests: write` lets the action open/update PRs.
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    # Job-level env so the Chromatic step's `if:` can gate on its presence.
    # GitHub Actions DOES NOT allow `secrets.*` references inside step-level
    # `if:` expressions — the previous fix was wrong. Promoting the secret to
    # a job-level env means `env.CHROMATIC_PROJECT_TOKEN` IS visible in `if:`
    # and evaluates to empty when the secret is not configured. See:
    # https://docs.github.com/en/actions/learn-github-actions/contexts#context-availability
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required by Chromatic so it can compute visual
          # baselines across commits. Default `fetch-depth: 1` gives only
          # the tip commit, which makes Chromatic fail with
          # "✖ Found only one commit". Mirrors visual-review.yml.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Required for `npm publish --provenance` to pick up the OIDC env.
          registry-url: https://registry.npmjs.org

      # Upgrade npm CLI to latest. Node 22 bundles npm 10.x, but npm
      # Trusted Publisher OIDC auth requires npm 11.5.1+. Without this,
      # OIDC signing still succeeds (sigstore attestation) but the PUT
      # to the registry fails with a misleading E404 because npm 10
      # doesn't know how to exchange the OIDC token for a publish session.
      #
      # npm 10's self-upgrade path is broken ("Cannot find module
      # 'promise-retry'") when the node_modules tree is midway through
      # install. Wipe npm's module tree and reinstall via node itself
      # (bypassing npm) — this is the workaround recommended by
      # nodejs/node#56341 and used by nodejs/setup-node internally.
      - name: Upgrade npm to 11+ (required for OIDC trusted publishing)
        run: |
          set -euo pipefail
          # Remove the corrupted npm 10.x install that's about to break
          # during self-upgrade.
          NODE_PREFIX=$(node -p "require('path').dirname(process.execPath) + '/..'")
          NPM_GLOBAL_DIR="$NODE_PREFIX/lib/node_modules/npm"
          echo "Removing corrupted npm at $NPM_GLOBAL_DIR"
          rm -rf "$NPM_GLOBAL_DIR"
          # Install npm fresh via node — use npm's official install script
          # which downloads a clean tarball and sets up bin shims without
          # relying on the removed npm CLI.
          curl -qL https://www.npmjs.com/install.sh | sh
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Quality gates (must all pass before publish) ────────────────────
      # These mirror `scripts/pre-publish-audit.mjs` so that CI and the
      # manual audit enforce the same invariants. Ordering mirrors the
      # audit script so a failure here is debuggable by re-running the
      # same step locally.

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: SSR smoke test (no browser APIs in Node.js)
        run: node packages/core/scripts/ssr-smoke-test.mjs

      # Pre-publish audit runs every HARD gate (git state, version/CHANGELOG
      # consistency, docs coverage, token audits, TW4 migration hygiene).
      # Previously this only ran on a developer's laptop via /publish-release.
      # That made every "HARD gate" in our docs social, not mechanical.
      # Wiring it here closes the gap.
      - name: Pre-publish audit
        run: node scripts/pre-publish-audit.mjs

      # Consumer smoke test installs the packed tarball into a throwaway
      # Next 16 + TW4 + Turbopack app and runs `next build`. Catches the
      # dist-side regressions (Node-only imports in client chunks, TW3
      # class leftovers, missing peer deps) that ALL other gates above
      # miss because none of them exercise Turbopack + TW4's CSS
      # generation. This is the gate that would have caught Karm's
      # 0.34/0.36 blockers before we shipped them.
      - name: Consumer smoke (Next 16 + Turbopack + TW4)
        run: node scripts/consumer-smoke-test.mjs

      # Second smoke variant — Next 15 + Webpack. A sizeable portion of
      # consumers are still on Webpack; TW4 + Webpack has different CSS
      # pipeline semantics than Turbopack. Runs only when the variant
      # directory exists so the step is a no-op until #58 lands.
      - name: Consumer smoke (Next 15 + Webpack)
        if: ${{ hashFiles('tests/smoke-consumer-next15/package.json') != '' }}
        run: node scripts/consumer-smoke-test.mjs --variant next15-webpack

      # Chromatic visual regression gate. Uploads a snapshot of every
      # Storybook story. Behavior depends on release mode:
      #
      #   - PRERELEASE (pre-mode, publishing to @next): uploads snapshots
      #     but does NOT block on diffs. The whole point of an RC is to
      #     surface visual changes for review BEFORE committing to a
      #     baseline — blocking here creates a chicken-and-egg where you
      #     can't show reviewers the diffs because you can't publish.
      #     `exitZeroOnChanges: true` + `autoAcceptChanges: true` uploads
      #     and auto-baselines so the @next publish proceeds.
      #
      #   - STABLE (no pre.json, publishing to @latest): blocks on any
      #     unreviewed diff. Stable publishes MUST have explicit approval
      #     of every visual change, because they bind the new baseline.
      #
      # Gate is skipped when CHROMATIC_PROJECT_TOKEN secret is not set so
      # the workflow remains green until the secret is configured.
      # The token is promoted to a job-level env (see `env:` block above)
      # because GitHub Actions does NOT allow secrets.* in step-level if:.
      - name: Chromatic visual review
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        uses: chromaui/action@v11
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          # `build-storybook` script lives at repo root, not in
          # packages/core — mirror the working config from
          # .github/workflows/visual-review.yml which has been
          # publishing Chromatic builds reliably.
          buildScriptName: build-storybook
          # Prerelease: upload + auto-accept (non-blocking).
          # Stable: upload + block on diff.
          exitZeroOnChanges: ${{ needs.guard.outputs.prerelease == 'true' }}
          autoAcceptChanges: ${{ needs.guard.outputs.prerelease == 'true' }}
          onlyChanged: true

      # ── Publish ─────────────────────────────────────────────────────────
      # OIDC-only auth via Trusted Publishers configured on npmjs.com.
      #
      # Critical: do NOT set NPM_TOKEN env here. When both NPM_TOKEN and
      # OIDC are present, changesets-action creates an .npmrc from the
      # token ("No user .npmrc file found, creating one with NPM_TOKEN
      # used as auth token") — which bypasses the OIDC auth path entirely.
      # `npm publish` then uses the token for auth and OIDC only for
      # provenance signing. If the package has a trusted publisher
      # configured, the registry expects OIDC-auth and rejects the token
      # PUT with a misleading 404.
      #
      # Authenticate via setup-node's registry-url + id-token:write
      # permission + publishConfig.provenance: true in package.json.
      # No tokens required.
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `npm publish --provenance` is emitted by `pnpm release` once
          # `publishConfig.provenance: true` is set in package.json.
          # OIDC auth proceeds via the id-token:write permission declared
          # on this job.
