name: Release

on:
  push:
    branches: [main]
  # Allow manual re-runs from the Actions UI / gh CLI without needing a new commit.
  # Useful when a prior publish failed on a transient issue (auth, registry outage,
  # token expiry) and we want to retry with the fix in place — as happened after
  # 0.36.0's initial NPM_TOKEN setup. See 2026-04-19 retro.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # ── Release-mode guard ─────────────────────────────────────────────────────
  # Ensures `.changeset/pre.json` state matches the intent of the run:
  #   - on branches other than `main` we don't publish at all
  #   - on `main` with `pre.json` present → we're in prerelease mode, publishing to `@next`
  #   - on `main` without `pre.json` → stable publish to `@latest`
  # If prerelease mode leaked onto a stable release (forgot `pnpm changeset pre exit`)
  # we fail the run BEFORE publishing.
  guard:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect prerelease state
        id: check
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "Release guard: .changeset/pre.json present → prerelease mode (@next)"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "Release guard: no pre.json → stable release (@latest)"
          fi

  # ── Release job — gated on guard ───────────────────────────────────────────
  release:
    needs: guard
    runs-on: ubuntu-latest
    # OIDC trusted publishing: `id-token: write` lets npm verify the publish
    # came from this workflow without a long-lived NPM_TOKEN. `contents: write`
    # lets changesets/action open the Version Packages PR and push tags.
    # `pull-requests: write` lets the action open/update PRs.
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Required for `npm publish --provenance` to pick up the OIDC env.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Quality gates (must all pass before publish) ────────────────────
      # These mirror `scripts/pre-publish-audit.mjs` so that CI and the
      # manual audit enforce the same invariants. Ordering mirrors the
      # audit script so a failure here is debuggable by re-running the
      # same step locally.

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: SSR smoke test (no browser APIs in Node.js)
        run: node packages/core/scripts/ssr-smoke-test.mjs

      # Pre-publish audit runs every HARD gate (git state, version/CHANGELOG
      # consistency, docs coverage, token audits, TW4 migration hygiene).
      # Previously this only ran on a developer's laptop via /publish-release.
      # That made every "HARD gate" in our docs social, not mechanical.
      # Wiring it here closes the gap.
      - name: Pre-publish audit
        run: node scripts/pre-publish-audit.mjs

      # Consumer smoke test installs the packed tarball into a throwaway
      # Next 16 + TW4 + Turbopack app and runs `next build`. Catches the
      # dist-side regressions (Node-only imports in client chunks, TW3
      # class leftovers, missing peer deps) that ALL other gates above
      # miss because none of them exercise Turbopack + TW4's CSS
      # generation. This is the gate that would have caught Karm's
      # 0.34/0.36 blockers before we shipped them.
      - name: Consumer smoke (Next 16 + Turbopack + TW4)
        run: node scripts/consumer-smoke-test.mjs

      # ── Publish ─────────────────────────────────────────────────────────
      # Trusted Publisher on npmjs.com is configured for this repo+workflow,
      # so NPM_TOKEN is no longer required once the migration to OIDC is
      # complete. We keep NPM_TOKEN as env fallback during the cutover —
      # remove after one successful OIDC publish.
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `npm publish --provenance` is emitted by `pnpm release` once
          # `publishConfig.provenance: true` is set in package.json.
