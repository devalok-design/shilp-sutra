name: Visual Review (Chromatic)

on:
  push:
    branches: [main]
    # Chromatic snapshots Storybook (the component library). Site-only changes
    # (apps/site/**) touch no story — skip to save snapshot quota.
    paths-ignore:
      - 'apps/site/**'
      - 'packages/mcp-server/**'
  pull_request:
    branches: [main]
    # PR runs are label-gated: add the "visual-review" label to snapshot a PR.
    # Main pushes always snapshot (keeps per-commit baselines attributable).
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'apps/site/**'
      - 'packages/mcp-server/**'
  workflow_dispatch:
    inputs:
      auto_accept:
        description: "Auto-accept all changes as new baselines"
        type: boolean
        default: false

jobs:
  chromatic:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'visual-review')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          exitZeroOnChanges: true
          exitOnceUploaded: true
          autoAcceptChanges: ${{ inputs.auto_accept || false }}
          onlyChanged: true
