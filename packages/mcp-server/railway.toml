# Railway config for the shilp-sutra-mcp service. The repo-root railway.toml
# pins apps/site/Dockerfile for the site service; this file overrides for the
# MCP service (set as "config file path" in the service settings).

[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/mcp-server/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
